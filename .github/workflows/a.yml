name: Cache Temizleme ve Bildirim

on:
  workflow_dispatch:

jobs:
  part13:
    name: cachetemizlik-telegram
    runs-on: ubuntu-latest

    steps:
      - name: Clean Cache
        id: cache_step
        env:
          CLEAN_CACHE: ${{ secrets.CLEAN_CACHE }}
        run: |
          echo "Cache temizleme isteği atılıyor..."

          if [ -n "$CLEAN_CACHE" ]; then
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$CLEAN_CACHE" 2>/dev/null)

            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Cache temizlendi"
              echo "success=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Cache temizlenemedi (Kod: $STATUS)"
              echo "success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "CLEAN_CACHE tanımlı değil, atlanıyor"
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Telegram Success Notification
        if: steps.cache_step.outputs.success == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚀✨ XTREAM SISTEMI BASARIYLA GUNCELLENDI ✅🔥"

          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE"

      - name: Telegram Fail Notification (Opsiyonel)
        if: steps.cache_step.outputs.success == 'false'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌⚠️ XTREAM SISTEMI GUNCELLENEMEDI!"

          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE"
