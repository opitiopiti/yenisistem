name: FULL XTREAM SISTEMI

on:
  workflow_dispatch:
  schedule:
    - cron: '18 */3 * * *'

concurrency:
  group: xtream-system
  cancel-in-progress: false
  
jobs:   
  part1:
    name: m3ufile repo
    runs-on: ubuntu-latest
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      
    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx
          
      - name: Run vavoosite.py Script
        run: python private_py/vavoosistemleri/vavoosite.py || true

      - name: Run vavooapp.py Script
        run: python private_py/vavoosistemleri/vavooapp.py || true
        
      - name: Sync M3U outputs to private repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/m3ufile.git privaate_m3u8file

          cp v/vavoolive.m3u privaate_m3u8file/vavoolive.m3u || echo "v/vavoolive.m3u bulunamadı"
          cp v/vavooapp.m3u privaate_m3u8file/vavooapp.m3u || echo "v/vavooapp.m3u bulunamadi"
          
          cd privaate_m3u8file
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto playlist update" || echo "No changes"
          git push origin main
          
  part2:
    name: Kategori Sistemi
    runs-on: ubuntu-latest
    needs: part1
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles

      - name: Run series_kategori_guncelleme Script
        run: python private_py/genelkodlar/category.py || true

      - name: Commit and Push Ana JSONs to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add xtream/series_category.json || echo "No files"
          git commit -m "Series Category JSON ve Pro güncellendi [auto]" || echo "No changes"
          git push origin main

  part3:
    name: Epg
    runs-on: ubuntu-latest
    needs: part2
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx

      - name: Run epg.py Script
        run: python private_py/genelkodlar/gunlukepg.py || true

      - name: Commit and Push EPG to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add xtream/tum_kanallar.xml xtream/tum_kanallar.gz || echo "No files"
          git commit -m "Günlük EPG ve Json güncellendi [auto]" || echo "No changes"
          git push origin main                          

  part4:
    name: VPS M3U Sistemi
    runs-on: ubuntu-latest

    steps:
      - name: VPS M3U GET İsteği Gönder
        shell: bash
        env:
          DAILY_M3U_LINK_DIZI: ${{ secrets.DAILY_M3U_LINK_DIZI }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ.get("DAILY_M3U_LINK_DIZI", "").strip()

          if not url.startswith(("http://", "https://")):
              sys.exit("HATA: DAILY_M3U_LINK_DIZI geçersiz veya boş!")

          try:
              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={"User-Agent": "GitHub-Actions-M3U"}
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status == 202:
                      print("✅ M3U isteği VPS tarafından kabul edildi.")
                  else:
                      print(f"✅ VPS yanıt verdi: HTTP {response.status}")

          except urllib.error.HTTPError as e:
              sys.exit(f"❌ VPS HTTP hatası: {e.code}")

          except Exception as e:
              sys.exit(f"❌ Bağlantı hatası: {type(e).__name__}")
          PY
          
  part20:
    name: xtreamsistemigecis
    runs-on: ubuntu-latest
    needs: [part1, part2, part3, part4]
    steps:
      - name: Wait and Transition to Python Code
        run: |
          echo "Waiting for 15 minutes..."
          sleep 900
          echo "Xtream sistem python kodlarına geçiş yapılıyor"
          
  part21:
    name: Tüm Repoları Tek Bir M3U Yapma
    runs-on: ubuntu-latest
    needs: part20
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      
    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx
          
      - name: Run sistemkontrol.py Script
        run: python private_py/genelkodlar/proxykontrol.py || true
        
      - name: Run tekrepoyapma.py Script
        run: python private_py/genelkodlar/repotekyapma.py || true

      - name: Sync JSON outputs to private repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/m3ufile.git privaate_m3ufilee
          
          cp sezonlukdizi.m3u privaate_m3ufilee/sezonlukdizi.m3u || echo "sezonlukdizi.m3u bulunamadı"
          cp tumdiziler.m3u privaate_m3ufilee/tumdiziler.m3u|| echo "tumdiziler.m3u bulunamadı"
          cp tumfilmler.m3u privaate_m3ufilee/tumfilmler.m3u|| echo "tumfilmer.m3u bulunamadı"
          
          cd privaate_m3ufilee
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.m3u
          git commit -m "Auto M3U playlist update" || echo "No changes"
          git push origin main

  part22:
    name: Tüm M3U Dosyalarını XTREAM hazırlama
    runs-on: ubuntu-latest
    needs: part21
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      
    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx

      - name: Run tumsistemtekm3u.py Script
        run: python private_py/genelkodlar/tumsistemtekm3u.py || true

      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Configure AWS for Cloudflare R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload JSON files to Cloudflare R2
        run: |
          aws s3 cp xtream/live_merged.m3u s3://iptv/live_merged.m3u \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "text/plain; charset=utf-8"

          aws s3 cp xtream/vod_merged.m3u s3://iptv/vod_merged.m3u \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "text/plain; charset=utf-8"

          aws s3 cp xtream/series_merged.m3u s3://iptv/series_merged.m3u \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "text/plain; charset=utf-8"
          
  part23:
    name: xtreamsistemijson
    runs-on: ubuntu-latest
    needs: part22
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      
    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx
          
      - name: Run livejson.py Script
        run: python private_py/xtreamjson/livejsonmaker.py || true

      - name: Run seriesjson.py Script
        run: python private_py/xtreamjson/seriesjson.py || true

      - name: Run vodjson.py Script
        run: python private_py/xtreamjson/vodjsonmaker.py || true

      - name: Commit and Push XTREAM numarasi JSONs to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add xtream/channel_id.json xtream/series_id.json xtream/vod_id.json || echo "No files"
          git commit -m "All XTREAM JSON numaralari güncellendi [auto]" || echo "No changes"
          git push origin main
            
      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Configure AWS for Cloudflare R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload JSON files to Cloudflare R2
        run: |
          aws s3 cp xtream/live.json s3://iptv/live.json \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "application/json; charset=utf-8"

          aws s3 cp xtream/series.json s3://iptv/series.json \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "application/json; charset=utf-8"
      
          aws s3 cp xtream/vod.json s3://iptv/vod.json \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "application/json; charset=utf-8"
           
  part24:
    name: cachetemizlik-telegram
    needs: part23
    runs-on: ubuntu-latest

    steps:
    - name: Clean Cache Xtream
      id: cache_step
      env:
        CLEAN_CACHE_XTREAM: ${{ secrets.CLEAN_CACHE_XTREAM }}
      run: |
        echo "XTREAM cache temizleme isteği atılıyor..."

        STATUS_XTREAM=$(curl -sS -L \
          --max-redirs 5 \
          --retry 3 \
          --retry-delay 2 \
          --fail-with-body \
          -o /dev/null \
          -w "%{http_code}" \
          "$CLEAN_CACHE_XTREAM") || STATUS_XTREAM="000"

        echo "XTREAM STATUS: $STATUS_XTREAM"

        echo "status_xtream=$STATUS_XTREAM" >> $GITHUB_OUTPUT

        if [[ "$STATUS_XTREAM" == "200" ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi

    - name: Telegram Success Notification
      if: steps.cache_step.outputs.success == 'true'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -o /dev/null -X POST \
          "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="🚀✨ XTREAM CACHE BASARIYLA TEMIZLENDI ✅🔥"

    - name: Telegram Fail Notification
      if: steps.cache_step.outputs.success == 'false'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -o /dev/null -X POST \
          "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="❌ CACHE TEMIZLEME HATASI! XTREAM=${{ steps.cache_step.outputs.status_xtream }}"
