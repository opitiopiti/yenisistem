        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles dotenv httpx

      - name: Run yabancidizileryenibolumler.py Script
        run: python private_py/yabancidiziler/yabancidizileryenibolumler.py || true

      - name: Run epg.py Script
        run: python private_py/genelkodlar/gunlukepg.py || true

      - name: Commit and Push EPG to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add xtream/tum_kanallar.xml xtream/tum_kanallar.gz yabancidiziler/*.json || echo "No files"
          git commit -m "Günlük EPG ve Json güncellendi [auto]" || echo "No changes"
          git push origin main

      - name: Sync Outputs to Private Repos
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/yabancidiziler.git private_yabancidiziler
          rsync -a yabancidiziler/ private_yabancidiziler/
          cd private_yabancidiziler
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add . || echo "No files"
          git commit -m "Yabancidiziler çıktı güncellendi [auto]" || echo "No changes"
          git push origin main
          
