name: FULL XTREAM SISTEMI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
    
jobs:
  part1:
    name: Json Olusturma
    runs-on: ubuntu-latest
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp

      - name: Run Dizigom JSON Script
        run: python private_py/dizigom/dizigomjson.py || true

      - name: Run Diziyoso JSON Script
        run: python private_py/diziyoso/diziyosojson.py || true

      - name: Run Sezonlukdizi JSON Script
        run: python private_py/sezonlukdizi/sezonlukdizijson.py || true

      - name: Run YabanciDiziler JSON Script
        run: python private_py/yabancidiziler/yabancidizilerjson.py || true

      - name: Run Setfilmizle JSON Script
        run: python private_py/setfilmizle/dizilerjson.py || true
        
      - name: Run Dizipal JSON Script
        run: python private_py/dizipal/dizilerjson.py || true        
        
      - name: Commit and Push All JSONs to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add **/*.json || echo "No dizigom files"
          git commit -m "ANA JSON güncellendi [auto]" || echo "No changes"
          git push origin main

  part2:
    name: Kategori Sistemi
    runs-on: ubuntu-latest
    needs: part1
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone Private Py Repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install Shared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp

      - name: Run series_kategori_guncelleme Script
        run: python private_py/genelkodlar/category.py || true

      - name: Commit and Push Ana JSONs to public repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add xtream/series_category.json || echo "No files"
          git commit -m "Series Category JSON güncellendi [auto]" || echo "No changes"
          git push origin main

  part3:
    name: yabancidiziler - epg
    runs-on: ubuntu-latest
    needs: part2
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
