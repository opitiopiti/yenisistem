name: DAILY MAKER

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: xtream-system
  cancel-in-progress: false

jobs:
  part1:
    name: Proxy Sistemi
    runs-on: ubuntu-latest
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone private repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests
          
      - name: Run proxy script
        run: python private_py/sinewix/proxyarama.py || true

      - name: Commit proxy result
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add sinewix/pro.txt || true
          git commit -m "Sinewix Proxy Update [auto]" || exit 0
          git push origin main


  part2:
    name: sinewix generator
    runs-on: ubuntu-latest
    needs: part1
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone scripts repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles python-dotenv httpx

      - name: Run sinewix scripts
        run: |
          python private_py/sinewix/sinewixanimeler.py || true
          python private_py/sinewix/sinewixfilmler.py || true
          python private_py/sinewix/sinewixseries.py || true

      - name: Sync outputs
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/sinewix.git out_repo

          cp *.m3u out_repo/ || true

          cd out_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto sinewix update" || exit 0
          git push origin main


  part3:
    name: dizibol generator
    runs-on: ubuntu-latest
    needs: part2
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone scripts repo
        run: git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles python-dotenv httpx

      - name: Run dizibol script
        run: python private_py/dizibol/tumdiziler.py || true

      - name: Sync dizibol output
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/sinewix.git out_repo

          cp dizibol.m3u out_repo/dizibol.m3u || true

          cd out_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto dizibol update" || exit 0
          git push origin main

      - name: Trigger dizifilm daily workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily2.yml/dispatches \
            -d '{"ref":"main"}'
