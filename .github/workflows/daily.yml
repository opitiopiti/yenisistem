name: GÜNLÜK BİR DEFA XTREAM

on:
  workflow_dispatch:
  schedule:
    - cron: '18 1 * * *'

concurrency:
  group: xtream-system
  cancel-in-progress: false

jobs:
  part1:
    name: VPS M3U Sistemi
    runs-on: ubuntu-latest

    steps:
      - name: VPS M3U GET İstekleri Gönder
        shell: bash
        env:
          GUNLUK_M3U_LINK_DIZI: ${{ secrets.GUNLUK_M3U_LINK_DIZI }}
          GUNLUK_M3U_LINK_DIZI2: ${{ secrets.GUNLUK_M3U_LINK_DIZI2 }}
          GUNLUK_M3U_LINK_FILM: ${{ secrets.GUNLUK_M3U_LINK_FILM }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          links = {
              "Dizi": os.environ.get("GUNLUK_M3U_LINK_DIZI", "").strip(),
              "Dizi2": os.environ.get("GUNLUK_M3U_LINK_DIZI2", "").strip(),
              "Film": os.environ.get("GUNLUK_M3U_LINK_FILM", "").strip()
          }

          errors = []

          for name, url in links.items():
              if not url.startswith(("http://", "https://")):
                  errors.append(f"{name}: URL geçersiz veya boş!")
                  continue

              try:
                  request = urllib.request.Request(
                      url,
                      method="GET",
                      headers={"User-Agent": "GitHub-Actions-M3U"}
                  )

                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status == 202:
                          print(f"✅ {name}: M3U isteği VPS tarafından kabul edildi.")
                      else:
                          print(f"✅ {name}: HTTP {response.status}")

              except urllib.error.HTTPError as e:
                  errors.append(f"{name}: HTTP {e.code}")

              except Exception as e:
                  errors.append(f"{name}: {type(e).__name__}")

          if errors:
              for error in errors:
                  print(f"❌ {error}")
              sys.exit(1)
          PY
