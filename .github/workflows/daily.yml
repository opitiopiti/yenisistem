
name: Sadece Günde Bir Defa Güncelleme Alan M3U Dosyaları

on:
  workflow_dispatch:
  schedule:
    - cron: '18 1 * * *'

concurrency:
  group: xtream-system
  cancel-in-progress: false

jobs:
  part1:
    name: setfilmizle filmler generator
    runs-on: ubuntu-latest
    env:
      M3U_REPO_TOKEN: ${{ secrets.M3U_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clone scripts repo
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/tumsistem.git private_py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml aiohttp aiofiles python-dotenv httpx

      - name: Run setfilmizle scripts
        run: |
          python private_py/setfilmizle/filmler.py || true

      - name: Commit tmdb.json result
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add setfilmizle/tmdb.json || true
          git commit -m "SetFilmİzle Tmdb Json Update [auto]" || exit 0

          git fetch origin main
          git rebase origin/main

          git push origin main

      - name: Sync outputs
        run: |
          git clone https://x-access-token:${{ secrets.M3U_REPO_TOKEN }}@github.com/opitiopiti/daily_m3u.git oout_repo

          cp *.m3u oout_repo/ || true

          cd oout_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Auto Setfilmizle Filmler update" || exit 0
          git push origin main

  part2:
    name: VPS M3U Sistemi
    runs-on: ubuntu-latest

    steps:
      - name: VPS M3U GET İstekleri Gönder
        shell: bash
        env:
          GUNLUK_M3U_LINK_DIZI: ${{ secrets.GUNLUK_M3U_LINK_DIZI }}
          GUNLUK_M3U_LINK_FILM: ${{ secrets.GUNLUK_M3U_LINK_FILM }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          links = {
              "Dizi": os.environ.get("GUNLUK_M3U_LINK_DIZI", "").strip(),
              "Film": os.environ.get("GUNLUK_M3U_LINK_FILM", "").strip()
          }

          errors = []

          for name, url in links.items():
              if not url.startswith(("http://", "https://")):
                  errors.append(f"{name}: URL geçersiz veya boş!")
                  continue

              try:
                  request = urllib.request.Request(
                      url,
                      method="GET",
                      headers={"User-Agent": "GitHub-Actions-M3U"}
                  )

                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status == 202:
                          print(f"✅ {name}: M3U isteği VPS tarafından kabul edildi.")
                      else:
                          print(f"✅ {name}: HTTP {response.status}")

              except urllib.error.HTTPError as e:
                  errors.append(f"{name}: HTTP {e.code}")

              except Exception as e:
                  errors.append(f"{name}: {type(e).__name__}")

          if errors:
              for error in errors:
                  print(f"❌ {error}")
              sys.exit(1)
          PY
